[project]
name = "data-dragon-ingestion"
version = "0.1.0"
description = ""
authors = [
    {name = "Gabriel Palma",email = "gabriel.palma.oliveira@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]

[tool.poetry]
packages = [{include = "data_dragon_ingestion", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.1,<0.16.0)"
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "Q",
    "S",
    "T",
    "UP",
    "W",
    "RUF"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff]
line-length = 120

[tool.pylint.messages_control]
max-line-length = 120